name: Apply v0.4 artifact domain models

on:
  push:
    branches: [feature]
    paths:
      - "scripts/apply_v0_4_file_artifacts_models.py"
      - "scripts/.v0_4_file_artifacts_models.payload"
      - ".github/workflows/apply-v0.4-file-artifacts-models.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-artifact-models:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Apply artifact domain model migration
        run: python scripts/apply_v0_4_file_artifacts_models.py

      - name: Compile sources and tests
        run: python -m compileall src tests scripts/apply_v0_4_file_artifacts_models.py

      - name: Run artifact model and configuration tests
        run: python -m unittest discover -s tests -p "test_artifact*.py" -v

      - name: Run adjacent model regressions
        run: |
          python -m unittest discover -s tests -p "test_storage_models.py" -v
          python -m unittest discover -s tests -p "test_planning_models.py" -v
          python -m unittest discover -s tests -p "test_llm_contracts.py" -v

      - name: Remove one-shot migration files
        run: |
          rm scripts/apply_v0_4_file_artifacts_models.py
          rm scripts/.v0_4_file_artifacts_models.payload
          rm .github/workflows/apply-v0.4-file-artifacts-models.yml

      - name: Commit artifact domain foundation
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v0.4-file-artifacts: add artifact domain models and configuration"
          git push origin HEAD:feature
