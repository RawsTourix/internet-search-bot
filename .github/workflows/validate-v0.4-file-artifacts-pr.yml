name: Validate v0.4 file artifacts PR

on:
  pull_request:
    branches: [feature]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Run validation suites
        id: suites
        shell: bash
        run: |
          mkdir -p validation-logs
          overall=0
          run_suite() {
            name="$1"
            shift
            set +e
            "$@" > "validation-logs/${name}.log" 2>&1
            code=$?
            set -e
            echo "$code" > "validation-logs/${name}.status"
            if [ "$code" -ne 0 ]; then overall=1; fi
          }
          run_suite compile python -m compileall src tests scripts
          run_suite artifacts python -m unittest discover -s tests -p "test_artifact*.py" -v
          run_suite storage python -m unittest discover -s tests -p "test_storage*.py" -v
          run_suite plans python -m unittest discover -s tests -p "test_plan*.py" -v
          run_suite planning python -m unittest discover -s tests -p "test_planning*.py" -v
          run_suite api python -m unittest discover -s tests -p "test_api*.py" -v
          echo "overall=$overall" >> "$GITHUB_OUTPUT"
      - name: Upload validation logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v0.4-file-artifacts-validation
          path: validation-logs
          if-no-files-found: error
      - name: Enforce validation status
        if: always()
        shell: bash
        run: exit "${{ steps.suites.outputs.overall || '1' }}"
