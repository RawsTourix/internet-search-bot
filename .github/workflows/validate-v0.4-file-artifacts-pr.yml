name: Validate v0.4 file artifacts PR

on:
  pull_request:
    branches: [feature]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Compile
        run: python -m compileall src tests scripts
      - name: Artifact and ingress tests
        run: python -m unittest discover -s tests -p "test_artifact*.py" -v
      - name: Storage regression
        run: python -m unittest discover -s tests -p "test_storage*.py" -v
      - name: Planning regression
        run: |
          python -m unittest discover -s tests -p "test_plan*.py" -v
          python -m unittest discover -s tests -p "test_planning*.py" -v
      - name: API regression
        run: python -m unittest discover -s tests -p "test_api*.py" -v
