name: v0.4 DAG planning tests

on:
  push:
    branches: [feature]
    paths:
      - "src/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/v0.4-dag-planning-tests.yml"
  workflow_dispatch:

jobs:
  planning-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Compile sources and tests
        run: python -m compileall src tests
      - name: Run planning tests
        run: |
          python -m unittest discover -s tests -p "test_planning*.py" -v
          python -m unittest discover -s tests -p "test_plan*.py" -v
      - name: Run planning-adjacent regressions
        run: |
          python -m unittest discover -s tests -p "test_cycle*.py" -v
          python -m unittest discover -s tests -p "test_result_compaction*.py" -v
          python -m unittest discover -s tests -p "test_progress_events.py" -v
          python -m unittest discover -s tests -p "test_llm_contracts.py" -v
