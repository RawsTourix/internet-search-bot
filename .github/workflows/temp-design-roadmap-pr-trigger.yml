name: Temporary design roadmap PR trigger

on:
  pull_request:
    branches:
      - feature
    types:
      - opened

permissions:
  contents: write

jobs:
  apply-design-roadmap:
    if: github.event.pull_request.head.ref == 'temp-design-roadmap-trigger'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout feature
        uses: actions/checkout@v4
        with:
          ref: feature
          fetch-depth: 0

      - name: Apply verified patch
        run: python scripts/temp_apply_design_roadmap.py

      - name: Remove temporary helpers and commit
        shell: bash
        run: |
          rm -f \
            scripts/temp_apply_design_roadmap.py \
            .github/workflows/temp-update-design-roadmap.yml \
            .github/workflows/temp-design-roadmap-pr-trigger.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/design_document.md scripts .github/workflows
          git commit -m "docs: extend architecture roadmap through v0.8"
          git push origin HEAD:feature
