name: Validate Input Runtime

on:
  push:
    branches:
      - feat/v0.4-input-runtime
  pull_request:
    branches:
      - feature
    paths:
      - "src/input_runtime/**"
      - "tests/test_input_runtime_*.py"
      - "src/api/mcp.config.example"
      - "scripts/audit_configuration_examples.py"
      - ".github/workflows/validate-input-runtime.yml"

permissions:
  contents: read

jobs:
  validate-input-runtime:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt pytest

      - name: Compile input runtime
        run: python -m compileall -q src/input_runtime

      - name: Run input-runtime contracts and common config audit
        run: >-
          python -m pytest -q
          tests/test_input_runtime_*.py
          tests/test_artifact_configuration_examples.py
