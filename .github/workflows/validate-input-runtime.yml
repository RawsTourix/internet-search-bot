name: Validate input runtime IR-1

on:
  pull_request:
    branches:
      - feature
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate-input-runtime:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt
          python -m pip install pytest

      - name: Compile input-runtime contracts
        run: python -m compileall src tests

      - name: Run input-runtime tests
        run: python -m pytest tests/test_input_runtime_*.py -q
