name: Validate v0.4 streaming storage

on:
  push:
    branches: [feature]
    paths:
      - ".ci/validate-v0.4-streaming-storage.trigger"
      - ".github/workflows/validate-v0.4-streaming-storage.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run validation and publish an explicit result
        shell: bash
        run: |
          set +e
          {
            python -m compileall src tests
            python -m unittest discover -s tests -p "test_storage_content_streaming.py" -v
            python -m unittest discover -s tests -p "test_storage*.py" -v
            python -m unittest discover -s tests -p "test_planning*.py" -v
            python -m unittest discover -s tests -p "test_plan*.py" -v
            python -m unittest discover -s tests -p "test_result_compaction*.py" -v
            python -m unittest discover -s tests -p "test_cycle_compaction*.py" -v
          } > /tmp/v0.4-streaming-validation.log 2>&1
          status=$?
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "$status" -eq 0 ]; then
            rm -f .ci/validate-v0.4-streaming-storage.trigger
            rm -f .github/workflows/validate-v0.4-streaming-storage.yml
            git add -A
            git commit -m "v0.4-file-artifacts: validate streaming content storage"
            git push origin HEAD:feature
            exit 0
          fi

          mkdir -p .ci
          {
            echo "exit_status=$status"
            echo "head_sha=$(git rev-parse HEAD)"
            echo "--- validation output ---"
            tail -n 500 /tmp/v0.4-streaming-validation.log
          } > .ci/v0.4-streaming-validation-failure.txt
          git add .ci/v0.4-streaming-validation-failure.txt
          git commit -m "v0.4-file-artifacts: record streaming validation failure"
          git push origin HEAD:feature
          exit "$status"
