name: Validate v0.4 artifact candidates

on:
  push:
    branches: [feature]
    paths:
      - "src/artifacts/**"
      - "src/mcp/artifact_client.py"
      - "src/mcp/planning_client.py"
      - "tests/test_artifact*.py"
      - ".github/workflows/validate-v0.4-artifact-candidates.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Validate and publish result
        shell: bash
        run: |
          set +e
          {
            python -m compileall src tests scripts
            python -m unittest discover -s tests -p "test_artifact*.py" -v
            python -m unittest discover -s tests -p "test_storage*.py" -v
            python -m unittest discover -s tests -p "test_plan*.py" -v
            python -m unittest discover -s tests -p "test_planning*.py" -v
            python -m unittest discover -s tests -p "test_result_compaction*.py" -v
            python -m unittest discover -s tests -p "test_cycle_compaction*.py" -v
          } > /tmp/artifact-candidate-validation.log 2>&1
          status=$?
          set -e
          mkdir -p .ci
          {
            echo "status=$status"
            echo "validated_head=$(git rev-parse HEAD)"
            echo "--- output ---"
            tail -n 700 /tmp/artifact-candidate-validation.log
          } > .ci/v0.4-artifact-candidate-validation.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ci/v0.4-artifact-candidate-validation.txt
          git commit -m "v0.4-file-artifacts: record candidate storage validation"
          git push origin HEAD:feature
          exit "$status"
