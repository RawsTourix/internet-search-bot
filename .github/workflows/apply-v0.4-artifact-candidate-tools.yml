name: Apply v0.4 artifact candidate tools

on:
  push:
    branches: [feature]
    paths:
      - ".github/workflows/apply-v0.4-artifact-candidate-tools.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Apply exact integration patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/mcp/artifact_client.py")
          text = path.read_text(encoding="utf-8")

          anchor = '''from ..artifacts.runtime import ArtifactRuntimeCoordinator
from ..artifacts.tools import (
'''
          replacement = '''from ..artifacts.candidate_tools import (
    ARTIFACT_CANDIDATE_TOOL_DEFINITIONS,
    ARTIFACT_CANDIDATE_TOOL_NAMES,
    ArtifactCandidateToolController,
)
from ..artifacts.runtime import ArtifactRuntimeCoordinator
from ..artifacts.tools import (
'''
          if text.count(anchor) != 1:
              raise SystemExit("candidate import anchor mismatch")
          text = text.replace(anchor, replacement, 1)

          old_constants = '''_ARTIFACT_MUTATION_TOOL_NAMES = frozenset(
    definition.name
    for definition in ARTIFACT_NATIVE_TOOL_DEFINITIONS
    if definition.mutation
)
_ARTIFACT_READ_TOOL_NAMES = (
    ARTIFACT_NATIVE_TOOL_NAMES - _ARTIFACT_MUTATION_TOOL_NAMES
)
'''
          new_constants = '''_ARTIFACT_MUTATION_TOOL_NAMES = frozenset(
    {
        definition.name
        for definition in (
            *ARTIFACT_NATIVE_TOOL_DEFINITIONS,
            *ARTIFACT_CANDIDATE_TOOL_DEFINITIONS,
        )
        if definition.mutation
    }
)
_ARTIFACT_ALL_TOOL_NAMES = frozenset(
    set(ARTIFACT_NATIVE_TOOL_NAMES) | set(ARTIFACT_CANDIDATE_TOOL_NAMES)
)
_ARTIFACT_READ_TOOL_NAMES = (
    _ARTIFACT_ALL_TOOL_NAMES - _ARTIFACT_MUTATION_TOOL_NAMES
)
'''
          if text.count(old_constants) != 1:
              raise SystemExit("candidate constants anchor mismatch")
          text = text.replace(old_constants, new_constants, 1)

          old_init = '''        self.artifact_runtime = (
            ArtifactRuntimeCoordinator(artifact_services.artifact_service)
            if artifacts_enabled
            else None
        )
        super().__init__(
'''
          new_init = '''        self.artifact_runtime = (
            ArtifactRuntimeCoordinator(artifact_services.artifact_service)
            if artifacts_enabled
            else None
        )
        self.artifact_candidate_tool_controller = (
            ArtifactCandidateToolController(
                promotion_service=artifact_services.promotion_service,
                candidate_store=artifact_services.candidate_store,
                max_items=artifact_services.config.max_artifacts_per_cycle,
            )
            if artifacts_enabled
            else None
        )
        super().__init__(
'''
          if text.count(old_init) != 1:
              raise SystemExit("candidate controller init anchor mismatch")
          text = text.replace(old_init, new_init, 1)

          old_build_tail = '''            tools[definition.name] = ManagerToolSpec(
                name=definition.name,
                description=definition.description,
                parameters=inline_local_schema_refs(definition.parameters()),
                handler=handler,
                progress_key=definition.progress_key,
            )
        return tools

    async def _manager_call_tool'''
          new_build_tail = '''            tools[definition.name] = ManagerToolSpec(
                name=definition.name,
                description=definition.description,
                parameters=inline_local_schema_refs(definition.parameters()),
                handler=handler,
                progress_key=definition.progress_key,
            )

        for definition in ARTIFACT_CANDIDATE_TOOL_DEFINITIONS:
            async def candidate_handler(
                arguments: dict[str, Any],
                *,
                tool_name: str = definition.name,
            ) -> dict[str, Any]:
                context = get_manager_context()
                if (
                    context is None
                    or self.artifact_candidate_tool_controller is None
                ):
                    return {
                        "type": "artifact_context_error",
                        "message": "Artifact tool requires an active agent cycle.",
                        "retryable": False,
                    }
                outcome = await self.artifact_candidate_tool_controller.execute(
                    tool_name,
                    arguments,
                    context,
                )
                await self._record_artifact_outcome(outcome, context)
                return outcome.payload

            tools[definition.name] = ManagerToolSpec(
                name=definition.name,
                description=definition.description,
                parameters=inline_local_schema_refs(definition.parameters()),
                handler=candidate_handler,
                progress_key=definition.progress_key,
            )
        return tools

    async def _manager_call_tool'''
          if text.count(old_build_tail) != 1:
              raise SystemExit("candidate manager registration anchor mismatch")
          text = text.replace(old_build_tail, new_build_tail, 1)

          call_anchor = '''    async def _call_registered_tool(
        self,
        public_tool_name: str,
        arguments: dict[str, Any],
    ):
        if public_tool_name in ARTIFACT_NATIVE_TOOL_NAMES:
'''
          call_replacement = '''    async def _call_registered_tool(
        self,
        public_tool_name: str,
        arguments: dict[str, Any],
    ):
        if public_tool_name in ARTIFACT_CANDIDATE_TOOL_NAMES:
            context = get_manager_context()
            if (
                context is None
                or self.artifact_candidate_tool_controller is None
            ):
                payload = {
                    "type": "artifact_context_error",
                    "message": "Artifact tool requires an active agent cycle.",
                    "retryable": False,
                }
            elif (
                public_tool_name in _ARTIFACT_MUTATION_TOOL_NAMES
                and self._active_plan_requires_node(context)
            ):
                state = context.active_cycle.active_plan_state
                payload = {
                    "type": "plan_node_required",
                    "plan_id": getattr(state, "plan_id", None),
                    "revision": getattr(state, "revision", None),
                    "message": (
                        "Before promoting an artifact candidate, start one "
                        "ready plan node."
                    ),
                    "retryable": True,
                }
                self._trace_event(
                    context.active_cycle.cycle_trace,
                    "plan_tool_call_blocked",
                    plan_id=payload["plan_id"],
                    revision=payload["revision"],
                    blocked_tool=public_tool_name,
                )
            else:
                outcome = await self.artifact_candidate_tool_controller.execute(
                    public_tool_name,
                    arguments,
                    context,
                )
                await self._record_artifact_outcome(outcome, context)
                payload = outcome.payload
                if outcome.payload.get("type") in {
                    "artifact_created",
                    "artifact_version_created",
                }:
                    await self._refresh_artifact_state(context)
            return self._text_result(payload)

        if public_tool_name in ARTIFACT_NATIVE_TOOL_NAMES:
'''
          if text.count(call_anchor) != 1:
              raise SystemExit("candidate call dispatch anchor mismatch")
          text = text.replace(call_anchor, call_replacement, 1)

          path.write_text(text, encoding="utf-8")
          PY
      - name: Validate integration
        run: |
          python -m compileall src tests scripts
          python -m unittest discover -s tests -p "test_artifact*.py" -v
          python -m unittest discover -s tests -p "test_plan_runtime_integration.py" -v
      - name: Publish clean commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-v0.4-artifact-candidate-tools.yml
          git add src/mcp/artifact_client.py
          git commit -m "v0.4-file-artifacts: integrate candidate promotion manager tools"
          git push origin HEAD:feature

# Triggered intentionally after the initial workflow creation commit.
