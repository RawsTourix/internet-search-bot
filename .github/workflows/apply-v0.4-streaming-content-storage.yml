name: Apply v0.4 streaming content storage

on:
  push:
    branches: [feature]
    paths:
      - "scripts/apply_v0_4_streaming_content_storage.py"
      - "scripts/.v0_4_streaming_content_storage.payload"
      - ".github/workflows/apply-v0.4-streaming-content-storage.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-streaming-storage:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Apply streaming storage migration
        run: python scripts/apply_v0_4_streaming_content_storage.py

      - name: Compile sources and tests
        run: python -m compileall src tests scripts/apply_v0_4_streaming_content_storage.py

      - name: Run streaming storage tests
        run: |
          python -m unittest discover -s tests -p "test_storage_content_store.py" -v
          python -m unittest discover -s tests -p "test_planning_content_store_streaming.py" -v

      - name: Run storage and planning regressions
        run: |
          python -m unittest discover -s tests -p "test_storage*.py" -v
          python -m unittest discover -s tests -p "test_planning*.py" -v
          python -m unittest discover -s tests -p "test_plan*.py" -v
          python -m unittest discover -s tests -p "test_result_compaction*.py" -v
          python -m unittest discover -s tests -p "test_cycle_compaction*.py" -v

      - name: Remove one-shot migration files
        run: |
          rm scripts/apply_v0_4_streaming_content_storage.py
          rm scripts/.v0_4_streaming_content_storage.payload
          rm .github/workflows/apply-v0.4-streaming-content-storage.yml

      - name: Commit streaming content storage
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "v0.4-file-artifacts: add streaming content storage"
          git push origin HEAD:feature
