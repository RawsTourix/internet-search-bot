name: Apply v0.4 artifact transport config

on:
  push:
    branches: [feature]
    paths:
      - ".github/workflows/apply-v0.4-artifact-transport.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Apply exact patch
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          path = Path("src/mcp/mcp_client.py")
          text = path.read_text(encoding="utf-8")
          old_import = "from typing import Optional, List, Dict, Any, Tuple, Callable, Awaitable"
          new_import = "from typing import Optional, List, Dict, Any, Tuple, Callable, Awaitable, Literal"
          if text.count(old_import) != 1:
              raise SystemExit("typing import anchor mismatch")
          text = text.replace(old_import, new_import, 1)

          old_model = "    enabled: bool = True\n    startup_required: bool = True\n"
          new_model = (
              "    enabled: bool = True\n"
              "    startup_required: bool = True\n"
              "    artifact_transport: Literal[\"none\", \"local_workspace\"] = \"none\"\n"
          )
          if text.count(old_model) != 1:
              raise SystemExit("ServerConfigType anchor mismatch")
          text = text.replace(old_model, new_model, 1)

          old_loader = (
              "                enabled=server_data.get(\"enabled\", True),\n"
              "                startup_required=server_data.get(\"startup_required\", True),\n"
              "            )"
          )
          new_loader = (
              "                enabled=server_data.get(\"enabled\", True),\n"
              "                startup_required=server_data.get(\"startup_required\", True),\n"
              "                artifact_transport=server_data.get(\n"
              "                    \"artifact_transport\",\n"
              "                    \"none\",\n"
              "                ),\n"
              "            )"
          )
          if text.count(old_loader) != 1:
              raise SystemExit("server config loader anchor mismatch")
          text = text.replace(old_loader, new_loader, 1)
          path.write_text(text, encoding="utf-8")
          PY
      - name: Validate patch
        run: |
          python -m compileall src tests scripts
          python -m unittest discover -s tests -p "test_artifact*.py" -v
          python -m unittest discover -s tests -p "test_storage_config.py" -v
          python -m unittest discover -s tests -p "test_server_manager.py" -v
          python -m unittest discover -s tests -p "test_result_compaction_integration.py" -v
          python -m unittest discover -s tests -p "test_plan_runtime_integration.py" -v
      - name: Publish clean commit
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/apply-v0.4-artifact-transport.yml
          git add src/mcp/mcp_client.py
          git commit -m "v0.4-file-artifacts: add explicit MCP artifact transport config"
          git push origin HEAD:feature
