name: Validate v0.4 artifact workspaces

on:
  push:
    branches: [feature]
    paths:
      - "src/artifacts/**"
      - "tests/test_artifact*.py"
      - ".github/workflows/validate-v0.4-artifact-workspace.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Validate and publish result
        shell: bash
        run: |
          set +e
          overall=0
          run_check() {
            "$@" >> /tmp/artifact-workspace-validation.log 2>&1
            code=$?
            if [ "$code" -ne 0 ]; then overall="$code"; fi
          }
          : > /tmp/artifact-workspace-validation.log
          run_check python -m compileall src tests scripts
          run_check python -m unittest discover -s tests -p "test_artifact*.py" -v
          run_check python -m unittest discover -s tests -p "test_storage*.py" -v
          run_check python -m unittest discover -s tests -p "test_plan*.py" -v
          run_check python -m unittest discover -s tests -p "test_planning*.py" -v
          run_check python -m unittest discover -s tests -p "test_result_compaction*.py" -v
          run_check python -m unittest discover -s tests -p "test_cycle_compaction*.py" -v
          set -e
          mkdir -p .ci
          {
            echo "status=$overall"
            echo "validated_head=$(git rev-parse HEAD)"
            echo "--- output ---"
            tail -n 800 /tmp/artifact-workspace-validation.log
          } > .ci/v0.4-artifact-workspace-validation.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ci/v0.4-artifact-workspace-validation.txt
          git commit -m "v0.4-file-artifacts: record workspace validation"
          git push origin HEAD:feature
          exit "$overall"
