name: Validate v0.4 artifact runtime

on:
  push:
    branches: [feature]
    paths:
      - "src/artifacts/**"
      - "src/mcp/**"
      - "src/api/**"
      - "src/agent/**"
      - "src/runtime/**"
      - "tests/test_artifact*.py"
      - "tests/test_plan*.py"
      - "tests/test_planning*.py"
      - "tests/test_storage*.py"
      - "tests/test_result_compaction*.py"
      - "tests/test_cycle_compaction*.py"
      - ".github/workflows/validate-v0.4-artifact-runtime.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Validate runtime and record result
        shell: bash
        run: |
          set +e
          {
            python -m compileall src tests scripts
            python -m unittest discover -s tests -p "test_artifact*.py" -v
            python -m unittest discover -s tests -p "test_storage*.py" -v
            python -m unittest discover -s tests -p "test_planning*.py" -v
            python -m unittest discover -s tests -p "test_plan*.py" -v
            python -m unittest discover -s tests -p "test_result_compaction*.py" -v
            python -m unittest discover -s tests -p "test_cycle_compaction*.py" -v
            python -m unittest discover -s tests -p "test_progress_events.py" -v
            python -m unittest discover -s tests -p "test_api_security.py" -v
          } > /tmp/artifact-runtime-validation.log 2>&1
          status=$?
          set -e
          mkdir -p .ci
          {
            echo "status=$status"
            echo "validated_head=$(git rev-parse HEAD)"
            echo "--- output ---"
            tail -n 700 /tmp/artifact-runtime-validation.log
          } > .ci/v0.4-artifact-runtime-validation.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .ci/v0.4-artifact-runtime-validation.txt
          git commit -m "v0.4-file-artifacts: record artifact runtime validation"
          git push origin HEAD:feature
          exit "$status"
