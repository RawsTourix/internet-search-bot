name: Apply design document update

on:
  push:
    branches: [feature]
    paths:
      - "scripts/apply_design_document_update.py"
      - ".github/workflows/apply-design-document-update.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-design-document:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Apply deterministic document migration
        run: python scripts/apply_design_document_update.py

      - name: Validate updated design document
        run: |
          python -m py_compile scripts/apply_design_document_update.py
          grep -Fq "# Часть VIII-E. v0.4 Unified Input and Artifact Architecture" docs/design_document.md
          grep -Fq "# Часть VIII-F. v0.4-file-artifacts" docs/design_document.md
          grep -Fq "# Часть VIII-F2. v0.4-input-runtime" docs/design_document.md
          grep -Fq "ClientResponseOutbox" docs/design_document.md
          grep -Fq "artifact_lineages" docs/design_document.md
          grep -Fq "SessionControlInbox" docs/design_document.md
          if grep -Fq "# Часть VIII-E. v0.4-file-artifacts" docs/design_document.md; then
            echo "Old simplified file-artifacts section is still present" >&2
            exit 1
          fi

      - name: Remove one-shot migration files
        run: |
          rm scripts/apply_design_document_update.py
          rm .github/workflows/apply-design-document-update.yml

      - name: Commit updated design document
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "docs: define unified input and artifact architecture"
          git push origin HEAD:feature
