name: Apply v0.4 artifact lineage store

on:
  push:
    branches: [feature]
    paths:
      - "scripts/apply_v0_4_artifact_lineage_store.py"
      - "scripts/.v0_4_artifact_lineage_store.payload"
      - ".ci/apply-v0.4-artifact-lineage-store.trigger"
      - ".github/workflows/apply-v0.4-artifact-lineage-store.yml"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply-and-validate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Apply lineage-store migration
        run: python scripts/apply_v0_4_artifact_lineage_store.py

      - name: Validate and publish explicit result
        shell: bash
        run: |
          set +e
          {
            python -m compileall src tests scripts
            python -m unittest discover -s tests -p "test_artifact_store.py" -v
            python -m unittest discover -s tests -p "test_artifact*.py" -v
            python -m unittest discover -s tests -p "test_storage*.py" -v
            python -m unittest discover -s tests -p "test_planning*.py" -v
            python -m unittest discover -s tests -p "test_plan*.py" -v
            python -m unittest discover -s tests -p "test_result_compaction*.py" -v
            python -m unittest discover -s tests -p "test_cycle_compaction*.py" -v
          } > /tmp/v0.4-artifact-lineage-validation.log 2>&1
          status=$?
          set -e

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if [ "$status" -eq 0 ]; then
            rm -f scripts/apply_v0_4_artifact_lineage_store.py
            rm -f scripts/.v0_4_artifact_lineage_store.payload
            rm -f .ci/apply-v0.4-artifact-lineage-store.trigger
            rm -f .ci/v0.4-artifact-lineage-failure.txt
            rm -f .github/workflows/apply-v0.4-artifact-lineage-store.yml
            git add -A
            git commit -m "v0.4-file-artifacts: add metadata-only artifact lineage store"
            git push origin HEAD:feature
            exit 0
          fi

          mkdir -p .ci
          {
            echo "exit_status=$status"
            echo "head_sha=$(git rev-parse HEAD)"
            echo "--- validation output ---"
            tail -n 500 /tmp/v0.4-artifact-lineage-validation.log
          } > .ci/v0.4-artifact-lineage-failure.txt
          git add -A
          git commit -m "v0.4-file-artifacts: record artifact lineage validation failure"
          git push origin HEAD:feature
          exit "$status"
